<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kaatha Book" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>📒 Transactions — Kaatha Book</title>
  <script src="/i18n.js"></script>
  <script src="/app.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 max-w-md mx-auto min-h-screen overflow-x-hidden">
  <div class="flex items-center justify-between mb-4">
    <a href="/index.html" class="text-green-700 font-semibold" data-i18n="back">← Back</a>
    <h1 class="text-xl font-bold" data-i18n="transactions">📒 Transactions</h1>
    <div class="flex items-center gap-3">
      <button id="lang-toggle" class="text-sm text-green-700 font-semibold underline">తెలుగు</button>
      <button id="logout" class="text-sm text-red-500 underline" data-i18n="logout">Logout</button>
    </div>
  </div>

  <input type="text" id="search" placeholder="🔍 Search by Customer Name" data-i18n-ph="search_ph" autocomplete="off"
    class="w-full p-3 border rounded-lg mb-3 text-base bg-white" />
  <div id="transactions" class="space-y-2 pb-8"></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
