<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Sign Up — Kaatha Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f7fa] flex items-center justify-center min-h-screen p-4">

  <div class="relative w-[320px]">
    <div class="absolute top-2 left-2 w-full h-full rounded-2xl bg-[#16a34a] transform -rotate-2"></div>

    <div class="relative bg-white rounded-2xl shadow-xl p-6 z-10">
      <h2 class="text-2xl font-bold text-center mb-1">🍲 Kaatha Book</h2>
      <p class="text-sm text-gray-500 text-center mb-6">Create your shop account</p>

      <input type="text" id="name" placeholder="Your Name" autocomplete="name"
        class="w-full mb-3 px-4 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input type="email" id="email" placeholder="Email Address" autocomplete="email"
        class="w-full mb-3 px-4 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input type="password" id="password" placeholder="Password (min 4 characters)" autocomplete="new-password"
        class="w-full mb-4 px-4 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500" />

      <p id="error" class="hidden text-red-500 text-sm mb-3 text-center"></p>

      <button id="signupBtn"
        class="w-full bg-[#16a34a] text-white py-3 rounded-lg font-semibold text-base active:bg-green-700">Sign Up</button>

      <p class="text-sm text-gray-500 text-center mt-4">
        Already have an account? <a href="/login.html" class="text-green-700 font-semibold underline">Log in</a>
      </p>
    </div>
  </div>

  <script>
    if (localStorage.getItem("fk_token")) window.location.href = "/index.html";

    const errBox = document.getElementById("error");
    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }

    async function doSignup() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!name || !email || !password) { showError("Fill in all three fields."); return; }
      const btn = document.getElementById("signupBtn");
      btn.disabled = true; btn.textContent = "Creating account…";
      try {
        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || "Signup failed."); return; }
        localStorage.setItem("fk_token", data.token);
        localStorage.setItem("fk_name", data.name || "");
        window.location.href = "/index.html";
      } catch (e) {
        showError("Could not reach the server. Check your connection.");
      } finally {
        btn.disabled = false; btn.textContent = "Sign Up";
      }
    }

    document.getElementById("signupBtn").addEventListener("click", doSignup);
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doSignup(); });
  </script>
</body>
</html>
