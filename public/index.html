<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kaatha Book" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>🍲 KAATHA BOOK</title>
  <script src="/app.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 max-w-md mx-auto min-h-screen">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">🍲 KAATHA BOOK</h1>
    <button id="logout" class="text-sm text-red-500 underline">Logout</button>
  </div>
  <p id="welcome" class="text-sm text-gray-500 mb-4"></p>

  <div class="bg-white p-4 rounded-xl shadow mb-4">
    <h2 class="font-bold mb-1">📋 Menu <span class="text-xs font-normal text-gray-500">— tap an item to add it below</span></h2>
    <div id="menu" class="space-y-3"></div>
  </div>

  <form id="transaction-form" class="bg-white p-4 rounded-xl shadow space-y-3 mb-4">
    <input type="hidden" id="edit-id" />
    <input type="text" id="customer" placeholder="Customer Name" required autocomplete="off"
      class="w-full p-3 border rounded-lg text-base" />

    <div id="items-container" class="space-y-2"></div>
    <button type="button" id="add-item" class="text-green-700 underline text-sm">+ Add Item</button>

    <!-- Paid / Katha toggle -->
    <div class="grid grid-cols-2 gap-2">
      <button type="button" id="type-katha"
        class="txn-type py-2 rounded-lg font-semibold border-2 border-amber-500 bg-amber-100 text-amber-800">📒 Katha (credit)</button>
      <button type="button" id="type-paid"
        class="txn-type py-2 rounded-lg font-semibold border-2 border-gray-200 bg-white text-gray-500">💵 Paid</button>
    </div>

    <p id="total-display" class="text-right font-bold text-lg text-green-700">Total: ₹0</p>

    <button type="submit" class="bg-green-600 text-white px-4 py-3 rounded-lg w-full font-semibold text-base active:bg-green-700">Save Transaction</button>
  </form>

  <a href="/transactions.html" class="block text-center bg-amber-500 text-white px-4 py-3 rounded-lg w-full font-semibold text-base active:bg-amber-600 mb-4">📒 View Transactions</a>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
