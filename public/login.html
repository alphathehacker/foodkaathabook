<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Login — Kaatha Book</title>
  <script src="/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f7fa] flex items-center justify-center min-h-screen p-4">

  <button id="lang-toggle" class="absolute top-4 right-4 text-sm text-green-700 font-semibold underline">తెలుగు</button>

  <div class="relative w-[320px]">
    <div class="absolute top-2 left-2 w-full h-full rounded-2xl bg-[#16a34a] transform rotate-2"></div>

    <div class="relative bg-white rounded-2xl shadow-xl p-6 z-10">
      <h2 class="text-2xl font-bold text-center mb-1">🍲 Kaatha Book</h2>
      <p class="text-sm text-gray-500 text-center mb-6" data-i18n="login_sub">Log in to your shop ledger</p>

      <input type="email" id="email" placeholder="Email Address" data-i18n-ph="email_ph" autocomplete="email"
        class="w-full mb-3 px-4 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input type="password" id="password" placeholder="Password" data-i18n-ph="password_ph" autocomplete="current-password"
        class="w-full mb-4 px-4 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500" />

      <p id="error" class="hidden text-red-500 text-sm mb-3 text-center"></p>

      <button id="loginBtn" data-i18n="login_btn"
        class="w-full bg-[#16a34a] text-white py-3 rounded-lg font-semibold text-base active:bg-green-700">Log In</button>

      <p class="text-sm text-gray-500 text-center mt-4">
        <span data-i18n="login_new">New here?</span> <a href="/signup.html" class="text-green-700 font-semibold underline" data-i18n="login_create">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    // Same API-base rule as app.js: the installed Android app runs on
    // https://localhost (no port), so talk to the live backend explicitly.
    const LIVE_API = "https://food-katha.onrender.com";
    const API_BASE = (window.location.protocol === "capacitor:" ||
      ((window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") && !window.location.port))
      ? LIVE_API
      : window.location.origin;
    const T = window.FK_I18N.T;

    if (localStorage.getItem("fk_token")) window.location.href = "/index.html";

    const errBox = document.getElementById("error");
    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) { showError(T("login_err_fields")); return; }
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = T("login_logging_in");
      try {
        const res = await fetch(API_BASE + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || T("login_err_failed")); return; }
        localStorage.setItem("fk_token", data.token);
        localStorage.setItem("fk_name", data.name || "");
        window.location.href = "/index.html";
      } catch (e) {
        showError(T("err_server"));
      } finally {
        btn.disabled = false; btn.textContent = T("login_btn");
      }
    }

    document.getElementById("loginBtn").addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
